openapi: 3.1.0

info:
  title: Task Management API
  version: 1.0.0
  description: >
    A fictional REST API for creating, retrieving,
    updating, filtering, and deleting tasks.

servers:
  - url: https://api.example.com/v1
    description: Example production server

paths:
  /tasks:
    post:
      summary: Create a task
      description: Creates a new task in the task management system.
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  example: Review API documentation
                status:
                  type: string
                  example: in_progress
                priority:
                  type: string
                  example: high
