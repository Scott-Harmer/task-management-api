openapi: 3.1.0

info:
  title: Task Management API
  version: 1.0.0
  description: >
    A fictional REST API for creating, retrieving,
    updating, filtering, and deleting tasks.

servers:
  - url: https://api.example.com/v1
    description: Example production server

paths:
  /tasks:
    post:
      summary: Create a task
      description: Creates a new task in the task management system.
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  example: Review API documentation
                status:
                  type: string
                  example: in_progress
                priority:
                  type: string
                  example: high
                        responses:
        '201':
          description: Task created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

    get:
      summary: Retrieve tasks
      description: Retrieves tasks and optionally filters them by status or project.
      operationId: listTasks
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: projectId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Tasks retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
components:
  schemas:
    Task:
      type: object
      required:
        - id
        - title
        - status
        - priority
      properties:
        id:
          type: string
          example: task_1024
        title:
          type: string
          example: Review API documentation
        status:
          type: string
          example: in_progress
        priority:
          type: string
          example: high
        projectId:
          type: string
          example: project_210
